      - name: Build lights HAL
        working-directory: lights-build
        run: |
          # NOTE: no `set -u` in this step. AOSP's build/envsetup.sh is
          # not nounset-safe: sourcing it runs _gettop_once, which reads
          # $TOP unguarded (envsetup.sh line 21, `[ -n "$TOP" ... ]`),
          # and lunch/m share the pattern. Run #3 died on exactly that
          # ("build/envsetup.sh: line 21: TOP: unbound variable").
          # `set -e` + pipefail still fail the step loudly on real errors.
          set -eo pipefail
          source build/envsetup.sh
          # Run #6 died here: `lunch yuzora_lights-userdebug` is a TWO-part
          # combo, and LineageOS 22.2's lunch() (build/envsetup.sh) requires
          # THREE parts, <product>-<release>-<variant> — with two parts the
          # variant is empty and lunch fails "Invalid lunch combo" before
          # compiling anything. trunk_staging is the default release (its

# Build the forked Samsung lights HAL (single module, minimal manifest).
#
# Builds ONLY android.hardware.light-service.samsung from
# kkisdevil/android_hardware_samsung (lineage-22.2, no-op NOTIFICATIONS
# light commit e7968ab) using the minimal repo manifest in
# build-lights/manifest.xml. A full LineageOS sync (~100 GB) does not fit
# a GitHub Actions runner (~14 GB usable disk); the minimal closure is
# ~5 GB sync + ~2 GB build output (see build-lights/README.md).
#
# The workflow FAILS LOUDLY (exit 1, ::error::) on: missing manifest,
# missing synced project, missing fork code, missing header, build
# failure, missing output binary, or a binary that does not contain the
# fork's handleNotificationsNoOp symbol. It never sets
# ALLOW_MISSING_DEPENDENCIES — a missing dep must fail the run, not be
# silently skipped.
#
# Triggers: manual (workflow_dispatch) and any push to lineage-22.2 that
# touches the HAL or the build-lights files, so each fix gets a build.

name: Build lights HAL

on:
  workflow_dispatch:
  push:
    branches: [lineage-22.2]
    paths:
      - 'aidl/light/**'
      - 'build-lights/**'

jobs:
  build-lights-hal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space (1/3)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache \
            /usr/local/share/boost /opt/ghc /usr/local/lib/android \
            /usr/share/swift /opt/az /usr/local/share/chromium
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git python3 curl ca-certificates binutils file

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bin:$PATH"
          repo --version

      - name: Init + sync minimal manifest
        run: |
          set -euo pipefail
          mkdir -p lights-build && cd lights-build
          git config --global user.email "yuzora-ci@aoisora.codes"
          git config --global user.name "YuZora CI"
          git config --global color.ui false
          # The manifest lives in the fork itself, at
          # build-lights/manifest.xml on lineage-22.2. If this step fails
          # with "manifest not found", the manifest has not been uploaded
          # to the fork yet.
          repo init -u https://github.com/kkisdevil/android_hardware_samsung \
            -b lineage-22.2 \
            -m build-lights/manifest.xml \
            --depth=1 --no-tags -c --no-repo-verify
          # Up to 3 sync attempts: googlesource/github fetches are flaky.
          # A timeout is NOT retried by repo itself, so we retry the whole
          # sync (it resumes — already-fetched projects are skipped).
          for attempt in 1 2 3; do
            echo "=== repo sync attempt $attempt ==="
            if repo sync -c -j"$(nproc)" --no-tags --force-sync; then
              echo "repo sync succeeded on attempt $attempt"
              break
            fi
            echo "::warning::repo sync attempt $attempt failed"
            if [ "$attempt" = "3" ]; then
              echo "::error::repo sync failed 3 times — see the log for the failing project"
              exit 1
            fi
            sleep 30
          done
          echo "=== disk after sync ==="
          df -h
          du -sh . | cat

      - name: Verify sync (fail loudly on missing projects)
        working-directory: lights-build
        run: |
          set -euo pipefail
          MISSING=""
          for p in \
            build/make build/soong build/blueprint build/release \
            prebuilts/build-tools prebuilts/go/linux-x86 \
            prebuilts/clang/host/linux-x86 toolchain/pgo-profiles \
            bionic system/libbase system/logging system/core \
            frameworks/native hardware/interfaces system/tools/aidl system/tools/hidl system/tools/xsdc \
            external/fmtlib external/googletest external/golang-protobuf external/starlark-go external/go-cmp \
            libnativehelper \
            system/apex prebuilts/rust external/rust/android-crates-io \
            hardware/google/pixel hardware/google/interfaces \
            kernel/configs system/sepolicy external/spdx-tools \
            hardware/samsung ; do
            if [ ! -d "$p" ]; then
              echo "::error::missing synced project: $p"
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::sync incomplete — missing:$MISSING"
            exit 1
          fi
          echo "All 32 manifest projects present."
          # The two files the whole build hinges on:
          test -f build/make/core/config.mk || { echo "::error::build/make/core/config.mk missing"; exit 1; }
          grep -q "define soong_config_set" build/make/core/config.mk \
            || { echo "::error::soong_config_set not defined in build/make/core/config.mk"; exit 1; }
          test -f hardware/samsung/aidl/light/Android.bp || { echo "::error::HAL .bp missing"; exit 1; }
          grep -q "samsung_header_path_defaults" hardware/samsung/aidl/light/Android.bp \
            || { echo "::error::HAL .bp does not use samsung_header_path_defaults"; exit 1; }
          # The clang version LineageOS 22.2 expects must exist in the
          # synced prebuilt (r536225). If this fails, the prebuilts/clang
          # pin is wrong for this soong revision.
          test -d prebuilts/clang/host/linux-x86/clang-r536225 \
            || { echo "::error::clang-r536225 not in synced prebuilts/clang — check the prebuilts/clang pin"; exit 1; }
          # Release configs must exist: lunch needs build/release, or
          # product config fails "No release config found for
          # TARGET_RELEASE: trunk_staging" (run #6 latent failure).
          test -f build/release/release_config_map.textproto \
            || { echo "::error::build/release release map missing — check the build/release pin"; exit 1; }
          test -f build/release/release_configs/trunk_staging.textproto \
            || { echo "::error::trunk_staging release config missing from build/release"; exit 1; }
          # Soong's soong_ui needs the Go protobuf runtime: without
          # external/golang-protobuf the build dies in 5s with "Failed to
          # find deps of android/soong/cmd/soong_ui ... no such file or
          # directory" (run #9).
          test -d external/golang-protobuf/proto \
            || { echo "::error::external/golang-protobuf/proto missing — check the golang-protobuf pin"; exit 1; }
            # Soong's rbcrun needs the Starlark-in-Go runtime: without
            # external/starlark-go the build dies with "Failed to find deps
            # of rbcrun/rbcrun ... external/starlark-go/starlark: no such
            # file or directory" (run #12).
            test -d external/starlark-go/starlark \
            || { echo "::error::external/starlark-go/starlark missing — check the starlark-go pin"; exit 1; }
          # golang-protobuf's own .bp needs the go-cmp Go module: without
          # external/go-cmp Soong bootstrap dies with
          # "golang-protobuf-internal-order depends on undefined module
          # \"go-cmp\"" (run #24, 45537619332).
          test -d external/go-cmp/cmp \
            || { echo "::error::external/go-cmp/cmp missing — check the go-cmp pin"; exit 1; }
          # Soong bootstrap needs kernel-config-soong-rules, soong-selinux
          # and the spdx-tools Go modules: without them bootstrap dies with
          # "depends on undefined module" (run #27, 45542381216).
          grep -q "kernel-config-soong-rules" kernel/configs/build/Android.bp \
            || { echo "::error::kernel-config-soong-rules not in kernel/configs/build/Android.bp — check the kernel/configs pin"; exit 1; }
          grep -q "soong-selinux" system/sepolicy/build/soong/Android.bp \
            || { echo "::error::soong-selinux not in system/sepolicy/build/soong/Android.bp — check the system/sepolicy pin"; exit 1; }
          test -f external/spdx-tools/spdx/v2_2/Android.bp \
            || { echo "::error::external/spdx-tools/spdx/v2_2/Android.bp missing — check the spdx-tools pin"; exit 1; }
          test -f external/spdx-tools/builder/builder2v2/Android.bp \
            || { echo "::error::external/spdx-tools/builder/builder2v2/Android.bp missing — check the spdx-tools pin"; exit 1; }
          test -f external/spdx-tools/spdx/common/Android.bp \
            || { echo "::error::external/spdx-tools/spdx/common/Android.bp missing — check the spdx-tools pin"; exit 1; }
          test -f external/spdx-tools/json/Android.bp \
            || { echo "::error::external/spdx-tools/json/Android.bp missing — check the spdx-tools pin"; exit 1; }
          test -f external/spdx-tools/spdxlib/Android.bp \
            || { echo "::error::external/spdx-tools/spdxlib/Android.bp missing — check the spdx-tools pin"; exit 1; }
          # Soong needs the HIDL plugin: without system/tools/hidl the
          # ninja-file generation dies with 'unrecognized module type
          # "hidl_interface"' (and "hidl_package_root") (run #30,
          # 45546989363) — the hidl_interface/hidl_package_root types are
          # registered only by the hidl-soong-rules plugin in
          # system/tools/hidl/build/.
          grep -q "hidl-soong-rules" system/tools/hidl/build/Android.bp \
            || { echo "::error::hidl-soong-rules not in system/tools/hidl/build/Android.bp — check the system/tools/hidl pin"; exit 1; }
          grep -q "hidl_interface" system/tools/hidl/build/hidl_interface.go \
            || { echo "::error::hidl_interface not registered in system/tools/hidl/build/hidl_interface.go — check the system/tools/hidl pin"; exit 1; }
          # Soong needs the xsdc plugin: without system/tools/xsdc the
          # ninja-file generation dies with 'unrecognized module type
          # "xsd_config"' (run #33, 45555113229) — the xsd_config type is
          # registered only by the xsdc-soong-rules plugin in
          # system/tools/xsdc/build/.
          grep -q "xsdc-soong-rules" system/tools/xsdc/build/Android.bp \
            || { echo "::error::xsdc-soong-rules not in system/tools/xsdc/build/Android.bp — check the system/tools/xsdc pin"; exit 1; }
          grep -q "xsd_config" system/tools/xsdc/build/xsdc.go \
            || { echo "::error::xsd_config not registered in system/tools/xsdc/build/xsdc.go — check the system/tools/xsdc pin"; exit 1; }
          echo "Sync verification passed."

      - name: Install device files from manifest repo
        working-directory: lights-build
        run: |
          set -euo pipefail
          # The build-lights/device files are in the fork (the manifest
          # repo), checked out by repo init at .repo/manifests.
          test -d .repo/manifests/build-lights/device/yuzora/yuzora_lights \
            || { echo "::error::build-lights/device/yuzora/yuzora_lights not in manifest repo — upload the device files to the fork"; exit 1; }
          cp -r .repo/manifests/build-lights/device device/
          ls -R device/yuzora/yuzora_lights
          test -f device/yuzora/yuzora_lights/AndroidProducts.mk
          test -f device/yuzora/yuzora_lights/yuzora_lights.mk
          test -f device/yuzora/yuzora_lights/BoardConfig.mk
          test -f device/yuzora/yuzora_lights/include/samsung_lights.h

      - name: Verify fork code + header
        working-directory: lights-build
        run: |
          set -euo pipefail
          echo "=== fork HEAD ==="
          git -C hardware/samsung rev-parse HEAD
          git -C hardware/samsung log --oneline -1
          # The no-op light must actually be in the synced fork code.
          grep -q "handleNotificationsNoOp" hardware/samsung/aidl/light/Lights.cpp \
            || { echo "::error::handleNotificationsNoOp NOT in synced Lights.cpp — hardware/samsung is not the fork (or the no-op commit is missing)"; exit 1; }
          grep -q "LightType::NOTIFICATIONS" hardware/samsung/aidl/light/Lights.cpp \
            || { echo "::error::NOTIFICATIONS registration NOT in synced Lights.cpp"; exit 1; }
          # The override header must be the a71-common one: PANEL nodes
          # only. If LED_BLINK_NODE were defined, the fork's unconditional
          # emplace would shadow a real LED handler on other devices —
          # and for m51 it would mean the header is the wrong one.
          grep -q "PANEL_BRIGHTNESS_NODE" device/yuzora/yuzora_lights/include/samsung_lights.h \
            || { echo "::error::PANEL_BRIGHTNESS_NODE missing from vendored header"; exit 1; }
          if grep -q "LED_BLINK_NODE" device/yuzora/yuzora_lights/include/samsung_lights.h; then
            echo "::error::vendored header defines LED_BLINK_NODE — wrong header for m51 (must be the PANEL-only a71-common override)"
            exit 1
          fi
          # The soong config call must be present and point at our header.
          grep -q "soong_config_set,samsungVars,target_specific_header_path,device/yuzora/yuzora_lights/include" \
            device/yuzora/yuzora_lights/BoardConfig.mk \
            || { echo "::error::BoardConfig.mk does not set samsungVars/target_specific_header_path to device/yuzora/yuzora_lights/include"; exit 1; }
          echo "Fork code + header verification passed."

      - name: Stub vendor/lineage envsetup.sh
        working-directory: lights-build
        run: |
          set -euo pipefail
          # Run #4 died in "Build lights HAL" (0s) before lunch ever ran:
          # LineageOS's build/envsetup.sh ends with an UNGUARDED
          # `. $ANDROID_BUILD_TOP/vendor/lineage/build/envsetup.sh`
          # (envsetup.sh line 1212 in the revision run #4 synced), and
          # build_build_var_cache() also cats that file during lunch. The
          # minimal manifest deliberately does NOT sync vendor/lineage —
          # the full LineageOS vendor tree is gigabytes of prebuilts this
          # build-only product never uses (yuzora_lights.mk inherits only
          # aosp_arm64.mk) — so sourcing envsetup.sh failed with
          # "vendor/lineage/build/envsetup.sh: No such file or directory"
          # and the step exited 1. This is a manifest-closure gap, not a
          # code or sync bug: every earlier step passed.
          #
          # Fix: create a stub with the real file's only top-level side
          # effect — the CLANG_VERSION / LLVM_AOSP_PREBUILTS_VERSION
          # export. get_clang_version.py lives in the synced build/soong
          # and reads only build/soong/cc/config/global.go, so it works in
          # the minimal tree. The rest of the real
          # vendor/lineage/build/envsetup.sh is interactive helpers
          # (brunch, breakfast, eat, ...) this workflow never calls.
          mkdir -p vendor/lineage/build
          cat > vendor/lineage/build/envsetup.sh <<'EOF'
          # Stub — see the "Stub vendor/lineage envsetup.sh" step in
          # .github/workflows/build-lights-hal.yml (run #4 fix). Provides the
          # real vendor/lineage/build/envsetup.sh's only top-level side
          # effect; its helper functions (brunch, breakfast, ...) are never
          # used by this build-only workflow.
          CLANG_VERSION=$(${ANDROID_BUILD_TOP}/build/soong/scripts/get_clang_version.py)
          export LLVM_AOSP_PREBUILTS_VERSION="${CLANG_VERSION}"

          # check_product (verbatim from LineageOS vendor/lineage/build/envsetup.sh;
          # run #6 fix): lunch() calls check_product <product> <release> before
          # _lunch_meat, and it is defined ONLY in the real vendor envsetup.sh —
          # without it lunch dies with "check_product: command not found" and,
          # under set -e, the roomservice.py fallback call then kills the step.
          # It resolves TARGET_DEVICE via _get_build_var_cached; for a
          # non-lineage_ product LINEAGE_BUILD is empty, which is correct here.
          function check_product()
          {
              local T=$(gettop)
              if [ ! "$T" ]; then
                  echo "Couldn't locate the top of the tree. Try setting TOP." >&2
                  return
              fi
              if (echo -n $1 | grep -q -e "^lineage_") ; then
                  LINEAGE_BUILD=$(echo -n $1 | sed -e 's/^lineage_//g')
              else
                  LINEAGE_BUILD=
              fi
              export LINEAGE_BUILD

                  TARGET_PRODUCT=$1 \
                  TARGET_RELEASE=$2 \
                  TARGET_BUILD_VARIANT= \
                  TARGET_BUILD_TYPE= \
                  TARGET_BUILD_APPS= \
                  _get_build_var_cached TARGET_DEVICE > /dev/null
              # hide successful answers, but allow the errors to show
          }
          
          # fixup_common_out_dir (verbatim from LineageOS vendor/lineage/build/envsetup.sh;
          # run #23 fix): _lunch_meat() calls fixup_common_out_dir (build/envsetup.sh
          # line 559) and it is defined ONLY in the real vendor envsetup.sh — without
          # it lunch dies with "fixup_common_out_dir: command not found" (exit 127),
          # 7s into the build step. It (re)creates out/target/common;
          # LINEAGE_FIXUP_COMMON_OUT is unset here, so it takes the plain mkdir branch.
          function fixup_common_out_dir() {
              common_out_dir=$(_get_build_var_cached OUT_DIR)/target/common
              target_device=$(_get_build_var_cached TARGET_DEVICE)
              common_target_out=common-${target_device}
              if [ ! -z $LINEAGE_FIXUP_COMMON_OUT ]; then
                  if [ -d ${common_out_dir} ] && [ ! -L ${common_out_dir} ]; then
                      mv ${common_out_dir} ${common_out_dir}-${target_device}
                      ln -s ${common_target_out} ${common_out_dir}
                  else
                      [ -L ${common_out_dir} ] && rm ${common_out_dir}
                      mkdir -p ${common_out_dir}-${target_device}
                      ln -s ${common_target_out} ${common_out_dir}
                  fi
              else
                  [ -L ${common_out_dir} ] && rm ${common_out_dir}
                  mkdir -p ${common_out_dir}
              fi
          }
          EOF
          test -f vendor/lineage/build/envsetup.sh \
            || { echo "::error::stub vendor/lineage/build/envsetup.sh missing after creation"; exit 1; }
          echo "Stub vendor/lineage/build/envsetup.sh created."
          # roomservice.py stub (run #6 fix): lunch() unconditionally calls
          # vendor/lineage/build/tools/roomservice.py — with "$product true"
          # on the check_product success path. The real script fetches
          # missing device repos from LineageOS GitHub; this build-only
          # product vendors its device files in the fork, so there is
          # nothing to fetch — a no-op that exits 0 is the correct stub.
          # (Without it, the call fails "No such file or directory" and
          # set -e kills the step right after check_product succeeds.)
          mkdir -p vendor/lineage/build/tools
          cat > vendor/lineage/build/tools/roomservice.py <<'EOF'
          #!/usr/bin/env python3
          # Stub — see the "Stub vendor/lineage envsetup.sh" step in
          # .github/workflows/build-lights-hal.yml (run #6 fix). lunch()
          # calls roomservice.py unconditionally; the real script fetches
          # missing device repos from LineageOS GitHub, which this
          # build-only product never needs (device files are vendored in
          # the fork). No-op, exits 0.
          import sys
          sys.exit(0)
          EOF
          chmod +x vendor/lineage/build/tools/roomservice.py
          test -x vendor/lineage/build/tools/roomservice.py \
            || { echo "::error::stub roomservice.py missing after creation"; exit 1; }
          echo "Stub vendor/lineage/build/tools/roomservice.py created."

      - name: Prune unneeded subtrees + stub missing defaults
        working-directory: lights-build
        run: |
          set -euo pipefail
          # Run #36 died in "Build lights HAL" (47s) at Soong's Android.bp
          # analysis with 11 "depends on undefined module" errors for five
          # modules — same failure shape as runs #24/#27 (blueprint-level
          # deps), one layer deeper. The xsdc fix WORKED (bootstrap compiled
          # all 114 steps, no xsd_config errors); the failure is now in
          # whole-tree analysis of modules the lights HAL never needs.
          #
          # Runs #38/#39 (same commit 1e987f7, one minute apart) proved the
          # undefined-module surface is MUCH larger than run #36's 11, and
          # that Soong reports a DIFFERENT SUBSET every run: #38 failed with
          # 5 errors, all in hardware/interfaces, NONE of which appear in
          # #39's 6 errors (and vice versa). Chasing the reported subset one
          # run at a time is whack-a-mole — so this step now fixes whole
          # CLASSES at once: stub a shared defaults module once instead of
          # pruning each referencing dir, and prune whole unrelated
          # subtrees instead of single dirs.
          #
          # ANOMALY (run #39): run #39 still failed on doze/dap/bluetooth-
          # VTS/libutils_headers errors although THIS step verified those
          # paths deleted and printed both success lines. Either the files
          # re-appeared between this step and `m`, or Soong read them from
          # elsewhere. The build step re-verifies immediately before `m`
          # (pre-build guard) to discriminate the two; if the guard passes
          # and Soong still errors on those paths, the prune itself is not
          # the problem.
          #
          # Four of the five modules are defined in projects FAR outside the
          # minimal closure, and every referencing module is unrelated to
          # the lights HAL — so they are PRUNED from the synced tree after
          # sync (a repo manifest cannot exclude subdirectories of a synced
          # project), instead of syncing gigabytes of new projects:
          #
          # - "SettingsLibDefaults" (used by hardware/samsung/doze
          #   SamsungDoze + hardware/samsung/dap SamsungDAP) is a
          #   java_defaults in frameworks/base/packages/SettingsLib/Android.bp
          #   (LineageOS android_frameworks_base, lineage-22.2). Syncing
          #   frameworks/base (~GBs, whose own .bp surface references
          #   hundreds more unsynced modules) for two unrelated apps is
          #   absurd. Doze (ambient display) + DAP have nothing to do with
          #   the lights HAL.
          # - "libcodec2-hidl-defaults" + "libcodec2-aidl-defaults" (used by
          #   hardware/samsung/aidl/codec2 android.software.media.c2-service.samsung)
          #   are cc_defaults in frameworks/av (media/codec2/hal/hidl/1.2/utils/Android.bp
          #   + media/codec2/hal/aidl/Android.bp, lineage-22.2). Same reason:
          #   frameworks/av is gigabytes; the codec2 media service is
          #   unrelated to the lights HAL.
          # - "use_libaidlvintf_gtest_helper_static" (used by VTS target
          #   tests under hardware/google/interfaces/bluetooth/*/aidl/vts
          #   AND hardware/interfaces/automotive/ivn_android_device/vts)
          #   is a cc_defaults in system/libvintf/libaidlvintf_test_helper/Android.bp
          #   (AOSP platform/system/libvintf, r32). Syncing system/libvintf
          #   alone would NOT close the chain: the defaults' static_libs
          #   need libz (external/zlib) + libselinux (external/selinux),
          #   neither synced — it would cascade into more missing modules.
          #   VTS tests are test-only and unrelated to the HAL. Run #38
          #   proved the run #36 bluetooth-only prune was too narrow (the
          #   ivn VTS test references the same module), so the module is
          #   now STUBBED once below (empty cc_defaults — VTS tests are
          #   never built, so only the NAME has to exist) AND every
          #   remaining `vts` dir under hardware/interfaces +
          #   hardware/google/interfaces is pruned as well.
          # - "neuralnetworks_utils_defaults" (used by
          #   hardware/interfaces/neuralnetworks/utils/{common,adapter/hidl})
          #   is a cc_defaults defined outside the synced tree. The NN utils
          #   are unrelated to the lights HAL, so it is STUBBED below
          #   (empty cc_defaults — same reasoning as the VTS helper).
          # - "latest_android_media_audio_common_types_import_interface"
          #   + "latest_android_media_soundtrigger_types_import_interface"
          #   (used in `defaults:` of the aidl_interface modules in
          #   hardware/interfaces/audio/aidl + soundtrigger/aidl) are
          #   defined in frameworks/av (unsynced, gigabytes). The audio +
          #   soundtrigger AIDL trees are unrelated to the lights HAL, so
          #   both subtrees are PRUNED whole (pruning only the aidl dirs
          #   would leave sibling dirs referencing the same modules).
          #
          # Run #42 (45575623402, 12m22s, build step 26s) + run #41
          # (45575497369, 18m36s, same code ec2a379, also FAILED) proved the
          # class-level fix above was still too narrow: 4 NEW undefined-module
          # errors, all in hardware/interfaces, none of them in the
          # #36/#38/#39 sets — "latest_android_hardware_audio_common_import_interface"
          # (hardware/interfaces/bluetooth/audio/aidl + automotive/audiocontrol/aidl),
          # "vhalclient_defaults" (hardware/interfaces/automotive/remoteaccess/hal/default)
          # and "latest_android_media_audio_common_types_import_interface"
          # (hardware/interfaces/automotive/audiocontrol/aidl). The #38/#39
          # fix itself HELD: the pre-build guard passed and Soong reported
          # NONE of the #36/#38/#39 errors again — so the run #39 anomaly is
          # RESOLVED (Soong reads the live tree; the files did not re-appear
          # and the prune is not the problem). The errors are genuinely new
          # dirs, one layer further out: Soong parses EVERY .bp file in the
          # synced tree, and hardware/interfaces is FULL of .bp files
          # referencing modules defined in unsynced frameworks/av and
          # frameworks/hardware/interfaces. Pruning one subtree per run is
          # the same whack-a-mole at a coarser grain — so this step now
          # prunes by CLOSURE, not by error list: the HAL needs exactly ONE
          # dir from each hardware tree, and everything else goes.
          #
          # What the HAL actually needs (traced file by file, README.md):
          # - hardware/interfaces/light/aidl ONLY: the aidl_interface
          #   android.hardware.light (versions 1+2, both with empty imports,
          #   no `defaults:` — verified live at LineageOS lineage-22.2), whose
          #   V2-ndk target the HAL links. Its 2.0/ HIDL dir and utils/
          #   (blank_screen) are NOT in the closure, so they are pruned too.
          #   The root hardware/interfaces/Android.bp STAYS: it defines
          #   hidl_package_root "android.hardware" and the
          #   hardware_interfaces_license module that light/aidl's
          #   default_applicable_licenses needs.
          # - hardware/interfaces/compatibility_matrices whole: it registers
          #   the vintf-compatibility-matrix-soong-rules plugin (run #27 —
          #   its deps kernel-config-soong-rules + soong-selinux + spdx-tools
          #   are synced). Pruning it would un-register a module type other
          #   .bp files may use; it is data + a plugin, so it stays.
          # - hardware/google/interfaces + hardware/google/pixel: NOTHING
          #   except their root Android.bp files. The fork's root .bp only
          #   imports their NAMESPACES (soong_namespace); no module in the
          #   closure references anything under them. All subdirs pruned.
          # - hardware/samsung/aidl/light ONLY: the HAL itself. The other
          #   aidl/* dirs (camera, fingerprint, health, memtrack, powershare,
          #   sensors, touch, usb, vibrator — verified live at lineage-22.2)
          #   reference android.hardware.*-ndk modules from
          #   hardware/interfaces/*, so pruning hardware/interfaces WITHOUT
          #   pruning them would CREATE new undefined-module errors. Same for
          #   the top-level fork dirs (AdvancedDisplay, fingerprint, hidl,
          #   interfaces, ril, sensors, vintf, dtbhtool, loki_tool,
          #   rebalance_interrupts): all unrelated to the lights HAL, all
          #   referencing pruned interface modules. They all go. Kept from
          #   the fork: aidl/light, the root Android.bp (+ mkbootimg.mk etc.)
          #   and build-lights/ (no .bp files in it — inert for Soong).
          # The stubs below (apex-lowest-min-sdk-version + the two empty
          # cc_defaults) stay: libutils still needs the apex stub, and the
          # VTS/NN stubs cost nothing now that their users are pruned.
          #
          # The fifth module CANNOT be pruned: "apex-lowest-min-sdk-version"
          # is used by system/core/libutils (libutils_headers +
          # libutils_impl_defaults), and libutils IS in the HAL closure
          # (libbinder_ndk -> libbinder -> libutils). It is defined in
          # packages/modules/common/sdk/Android.bp (LineageOS
          # android_packages_modules_common, lineage-22.2, lines 575-601) as
          # library_linking_strategy_cc_defaults with min_sdk_version "30".
          # Syncing that whole project would drag in its java/ + javatests/
          # concrete modules (which reference unsynced framework libs), so
          # instead the definition is STUBBED verbatim below — same module
          # type (imported from system/apex/Android.bp, which IS synced),
          # same name, same min_sdk_version "30", same defaults_visibility
          # (//system/core/libutils:__subpackages__ — libutils is the only
          # user in this tree, proven by run #36 reporting only libutils
          # errors for it), same soong_config_variables block. The stub
          # lives in yuzora-stubs/ at the tree root, next to the other
          # build-only stubs.
          echo "=== trees before prune (for forensics) ==="
          ls -d hardware/interfaces/*/ 2>/dev/null | sort
          ls -d hardware/google/interfaces/*/ 2>/dev/null | sort
          ls -d hardware/google/pixel/*/ 2>/dev/null | sort
          ls -d hardware/samsung/*/ 2>/dev/null | sort
          ls -d hardware/samsung/aidl/*/ 2>/dev/null | sort
          # hardware/interfaces: keep ONLY light/aidl (the HAL's AIDL
          # interface) + compatibility_matrices (the vintf plugin, run #27).
          # light/2.0 + light/utils are pruned too — not in the closure.
          # The root Android.bp (hidl_package_root + license) stays: the
          # loop below touches directories only, never files.
          for d in hardware/interfaces/*/; do
            case "$d" in
              hardware/interfaces/light/|hardware/interfaces/compatibility_matrices/) ;;
              *) rm -rf "$d" ;;
            esac
          done
          rm -rf hardware/interfaces/light/2.0 hardware/interfaces/light/utils
          # hardware/google/interfaces + hardware/google/pixel: keep only
          # the root Android.bp files (namespace imports); prune all subdirs.
          for d in hardware/google/interfaces/*/ hardware/google/pixel/*/; do
            rm -rf "$d"
          done
          # hardware/samsung: keep ONLY aidl/light. build-lights/ stays
          # (no .bp files in it — inert for Soong); everything else goes,
          # including the previously pruned doze/dap/codec2 (no-op if gone).
          for d in hardware/samsung/*/; do
            case "$d" in
              hardware/samsung/aidl/|hardware/samsung/build-lights/) ;;
              *) rm -rf "$d" ;;
            esac
          done
          for d in hardware/samsung/aidl/*/; do
            case "$d" in
              hardware/samsung/aidl/light/) ;;
              *) rm -rf "$d" ;;
            esac
          done
          # Kept paths must still exist (the prune must not have eaten them).
          for d in hardware/interfaces/light hardware/interfaces/light/aidl/Android.bp \
            hardware/interfaces/compatibility_matrices \
            hardware/interfaces/compatibility_matrices/build/Android.bp \
            hardware/interfaces/Android.bp \
            hardware/google/interfaces/Android.bp \
            hardware/google/pixel/Android.bp \
            hardware/samsung/aidl/light/Android.bp; do
            if [ ! -e "$d" ]; then
              echo "::error::prune removed a needed path: $d"
              exit 1
            fi
          done
          # No other subdir may survive in any of the four trees.
          LEFTOVER="$(find hardware/interfaces -mindepth 1 -maxdepth 1 -type d ! -name light ! -name compatibility_matrices)"
          if [ -n "$LEFTOVER" ]; then
            echo "::error::prune failed — hardware/interfaces leftovers:$LEFTOVER"
            exit 1
          fi
          if [ -n "$(find hardware/interfaces/light -mindepth 1 -maxdepth 1 -type d ! -name aidl)" ]; then
            echo "::error::prune failed — hardware/interfaces/light leftovers (only aidl may remain)"
            exit 1
          fi
          LEFTOVER="$(find hardware/google/interfaces hardware/google/pixel -mindepth 1 -maxdepth 1 -type d)"
          if [ -n "$LEFTOVER" ]; then
            echo "::error::prune failed — hardware/google leftovers:$LEFTOVER"
            exit 1
          fi
          LEFTOVER="$(find hardware/samsung -mindepth 1 -maxdepth 1 -type d ! -name aidl ! -name build-lights)"
          if [ -n "$LEFTOVER" ]; then
            echo "::error::prune failed — hardware/samsung leftovers:$LEFTOVER"
            exit 1
          fi
          LEFTOVER="$(find hardware/samsung/aidl -mindepth 1 -maxdepth 1 -type d ! -name light)"
          if [ -n "$LEFTOVER" ]; then
            echo "::error::prune failed — hardware/samsung/aidl leftovers:$LEFTOVER"
            exit 1
          fi
          echo "Unneeded subtrees pruned."
          mkdir -p yuzora-stubs
          cat > yuzora-stubs/Android.bp <<'EOF'
          // Stub — see the "Prune unneeded subtrees + stub missing
          // defaults" step in
          // .github/workflows/build-lights-hal.yml (run #36 fix).
          // Verbatim replica of the "apex-lowest-min-sdk-version"
          // definition from packages/modules/common/sdk/Android.bp
          // (LineageOS android_packages_modules_common, lineage-22.2,
          // lines 575-601; APEX_LOWEST_MIN_SDK_VERSION = "30", line 333).
          // The real project is NOT synced: its java/ + javatests/
          // concrete modules reference unsynced framework libs, so syncing
          // it would trade one undefined module for more. This stub gives
          // system/core/libutils (the only user in this tree) exactly what
          // the real definition gives it: min_sdk_version "30" by default.
          soong_config_module_type_import {
              from: "system/apex/Android.bp",
              module_types: [
                  "library_linking_strategy_cc_defaults",
              ],
          }

          library_linking_strategy_cc_defaults {
              name: "apex-lowest-min-sdk-version",
              defaults_visibility: [
                  "//system/core/libutils:__subpackages__",
              ],
              min_sdk_version: "30",
              soong_config_variables: {
                  library_linking_strategy: {
                      prefer_static: {
                          min_sdk_version: "apex_inherit",
                      },
                  },
              },
          }

          // use_libaidlvintf_gtest_helper_static (runs #38/#39 fix):
          // empty cc_defaults stub for the VTS-test helper defined in
          // system/libvintf/libaidlvintf_test_helper/Android.bp (AOSP r32,
          // unsynced — its static_libs chain needs libz + libselinux).
          // Referenced by VTS target tests across hardware/interfaces and
          // hardware/google/interfaces (bluetooth + automotive/ivn in runs
          // #36/#38/#39). VTS tests are never built for this HAL-only
          // target, so only the NAME has to exist for Soong's parse.
          cc_defaults {
              name: "use_libaidlvintf_gtest_helper_static",
              // Public on purpose: VTS tests referencing this helper live
              // all over hardware/interfaces + hardware/google/interfaces,
              // and more may surface on later runs — a restricted list
              // would turn an unknown user into a visibility error.
              defaults_visibility: [
                  "//visibility:public",
              ],
          }

          // neuralnetworks_utils_defaults (run #38 fix): empty cc_defaults
          // stub. Referenced by hardware/interfaces/neuralnetworks/utils/
          // {common,adapter/hidl}; NN utils are unrelated to the lights HAL
          // and never built here, so only the NAME has to exist.
          cc_defaults {
              name: "neuralnetworks_utils_defaults",
              // Public on purpose (see the VTS helper stub above): the
              // known users are the NN utils dirs, but an unknown user
              // elsewhere must not turn into a visibility error.
              defaults_visibility: [
                  "//visibility:public",
              ],
          }
          EOF
          for stub in apex-lowest-min-sdk-version use_libaidlvintf_gtest_helper_static neuralnetworks_utils_defaults; do
            grep -q "$stub" yuzora-stubs/Android.bp \
              || { echo "::error::stub missing after creation: $stub"; exit 1; }
          done
          grep -q "library_linking_strategy_cc_defaults" yuzora-stubs/Android.bp \
            || { echo "::error::stub does not use library_linking_strategy_cc_defaults"; exit 1; }
          echo "apex-lowest-min-sdk-version stub created."
          echo "use_libaidlvintf_gtest_helper_static + neuralnetworks_utils_defaults stubs created."

      - name: Build lights HAL
        working-directory: lights-build
        run: |
          # NOTE: no `set -u` in this step. AOSP's build/envsetup.sh is
          # not nounset-safe: sourcing it runs _gettop_once, which reads
          # $TOP unguarded (envsetup.sh line 21, `[ -n "$TOP" ... ]`),
          # and lunch/m share the pattern. Run #3 died on exactly that
          # ("build/envsetup.sh: line 21: TOP: unbound variable").
          # `set -e` + pipefail still fail the step loudly on real errors.
          set -eo pipefail
          source build/envsetup.sh
          # Run #6 died here: `lunch yuzora_lights-userdebug` is a TWO-part
          # combo, and LineageOS 22.2's lunch() (build/envsetup.sh) requires
          # THREE parts, <product>-<release>-<variant> — with two parts the
          # variant is empty and lunch fails "Invalid lunch combo" before
          # compiling anything. trunk_staging is the default release (its
          # configs live in build/release, added to the manifest by the
          # same fix) and userdebug is the variant.
          lunch yuzora_lights-trunk_staging-userdebug
          # Pre-build guard (run #39 anomaly, RESOLVED by run #42): run #39
          # failed on doze/dap/VTS/libutils errors although the prune step
          # verified those paths deleted. Run #42's guard passed and Soong
          # reported NONE of those errors again — Soong reads the live tree,
          # so the anomaly was new dirs, not re-appearing files. Re-verify
          # immediately before `m` anyway: if THIS fails, something
          # re-appeared between steps; if this passes and Soong still errors
          # on a pruned path, the prune itself is not the problem.
          # Kept paths must be present, and nothing else may survive in the
          # four pruned trees (same checks as the prune step).
          for d in hardware/interfaces/light hardware/interfaces/light/aidl/Android.bp \
            hardware/interfaces/compatibility_matrices \
            hardware/interfaces/compatibility_matrices/build/Android.bp \
            hardware/interfaces/Android.bp \
            hardware/google/interfaces/Android.bp \
            hardware/google/pixel/Android.bp \
            hardware/samsung/aidl/light/Android.bp; do
            if [ ! -e "$d" ]; then
              echo "::error::pre-build guard: kept path missing at build time: $d"
              exit 1
            fi
          done
          if [ -n "$(find hardware/interfaces -mindepth 1 -maxdepth 1 -type d ! -name light ! -name compatibility_matrices)" ]; then
            echo "::error::pre-build guard: hardware/interfaces subdir present at build time (only light + compatibility_matrices may remain)"
            exit 1
          fi
          if [ -n "$(find hardware/interfaces/light -mindepth 1 -maxdepth 1 -type d ! -name aidl)" ]; then
            echo "::error::pre-build guard: hardware/interfaces/light subdir present at build time (only aidl may remain)"
            exit 1
          fi
          if [ -n "$(find hardware/google/interfaces hardware/google/pixel -mindepth 1 -maxdepth 1 -type d)" ]; then
            echo "::error::pre-build guard: hardware/google subdir present at build time"
            exit 1
          fi
          if [ -n "$(find hardware/samsung -mindepth 1 -maxdepth 1 -type d ! -name aidl ! -name build-lights)" ]; then
            echo "::error::pre-build guard: hardware/samsung subdir present at build time (only aidl + build-lights may remain)"
            exit 1
          fi
          if [ -n "$(find hardware/samsung/aidl -mindepth 1 -maxdepth 1 -type d ! -name light)" ]; then
            echo "::error::pre-build guard: hardware/samsung/aidl subdir present at build time (only light may remain)"
            exit 1
          fi
          for stub in apex-lowest-min-sdk-version use_libaidlvintf_gtest_helper_static neuralnetworks_utils_defaults; do
            grep -q "$stub" yuzora-stubs/Android.bp \
              || { echo "::error::pre-build guard: stub missing at build time: $stub"; exit 1; }
          done
          echo "Pre-build guard passed: pruned paths absent, stubs present."
          # Single module only. No ALLOW_MISSING_DEPENDENCIES — a missing
          # dep must fail here, not be silently skipped.
          m -j"$(nproc)" android.hardware.light-service.samsung 2>&1 | tee build-lights.log
          echo "=== disk after build ==="
          df -h

      - name: Verify built binary
        working-directory: lights-build
        run: |
          set -euo pipefail
          BIN="out/target/product/yuzora_lights/vendor/bin/hw/android.hardware.light-service.samsung"
          test -f "$BIN" || { echo "::error::built binary missing: $BIN"; exit 1; }
          ls -l "$BIN"
          file "$BIN"
          # Must be an arm64 (aarch64) device binary, not a host binary.
          readelf -h "$BIN" | grep -qi "aarch64" \
            || { echo "::error::built binary is not AArch64"; exit 1; }
          # Proof the fork's code is actually IN the binary: the
          # unstripped copy keeps symbols. (Soong strips the installed
          # binary, so check symbols/ not the installed path.)
          UNSTRIPPED="out/target/product/yuzora_lights/symbols/vendor/bin/hw/android.hardware.light-service.samsung"
          if [ -f "$UNSTRIPPED" ]; then
            if nm "$UNSTRIPPED" 2>/dev/null | grep -q "handleNotificationsNoOp"; then
              echo "Fork code confirmed: handleNotificationsNoOp present in unstripped binary."
            else
              echo "::error::handleNotificationsNoOp NOT found in unstripped binary — the fork's no-op light did not compile in"
              exit 1
            fi
          else
            echo "::warning::unstripped symbols binary not found at $UNSTRIPPED — symbol check skipped (binary + arch checks still passed)"
          fi
          # The .rc and VINTF fragment should be installed alongside the
          # binary; warn (do not fail) if their install paths differ.
          find out/target/product/yuzora_lights/vendor/etc -name "*light-service.samsung*" -print || true
          # Build info for the artifact.
          {
            echo "product: yuzora_lights-trunk_staging-userdebug"
            echo "module: android.hardware.light-service.samsung"
            echo "fork HEAD: $(git -C hardware/samsung rev-parse HEAD)"
            echo "fork log: $(git -C hardware/samsung log --oneline -1)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "binary: $BIN"
            echo "size: $(stat -c%s "$BIN") bytes"
            echo "sha256: $(sha256sum "$BIN" | cut -d' ' -f1)"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Disk usage report
        working-directory: lights-build
        run: |
          df -h
          echo "=== largest top-level dirs ==="
          du -sh -- * 2>/dev/null | sort -rh | head -20 || true
          echo "=== out/ size ==="
          du -sh out/ 2>/dev/null || echo "no out/ dir"

      - name: Upload lights HAL artifact
        uses: actions/upload-artifact@v4
        with:
          name: lights-hal-m51
          path: |
            lights-build/out/target/product/yuzora_lights/vendor/bin/hw/android.hardware.light-service.samsung
            lights-build/out/target/product/yuzora_lights/vendor/etc/init/android.hardware.light-service.samsung.rc
            lights-build/out/target/product/yuzora_lights/vendor/etc/vintf/manifest/android.hardware.light-service.samsung.xml
            lights-build/build-lights.log
            lights-build/BUILD_INFO.txt
          retention-days: 14
          if-no-files-found: error

            { grep -A1 'cc_library_static {' yuzora-stubs/Android.bp || true; } | grep -Fq "name: \"$stub\"" || { echo "::error::pre-build guard: stub $stub is not a cc_library_static"; exit 1; }
          done
          # Runs #219/#220/#221/#222 fix: the new stubs must be present
          # at build time (same `name: "..."` grep form as above).
          for stub in android.hardware.graphics.composer@2.2 android.hardware.graphics.composer@2.3 android.hardware.graphics.composer@2.1-command-buffer android.hardware.graphics.composer@2.2-command-buffer android.hardware.graphics.composer@2.3-command-buffer android.hardware.graphics.composer@2.4-command-buffer android.hardware.graphics.composer3-command-buffer; do
            grep -Fq "name: \"$stub\"" yuzora-stubs/Android.bp || { echo "::error::pre-build guard: stub missing at build time: $stub"; exit 1; }
          done
          # Runs #219/#220/#221/#222 fix: the 2 plain cc_library stubs
          # must be plain cc_library at build time (same wrapped check
          # as the prune step above).
          for stub in android.hardware.graphics.composer@2.2 android.hardware.graphics.composer@2.3; do
            { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq "name: \"$stub\"" || { echo "::error::pre-build guard: stub $stub is not a plain cc_library"; exit 1; }
          done
          # Runs #219/#220/#221/#222 fix: the 5 -command-buffer stubs
          # must be cc_library_headers at build time (same wrapped
          # check as the prune step above).
          for stub in android.hardware.graphics.composer@2.1-command-buffer android.hardware.graphics.composer@2.2-command-buffer android.hardware.graphics.composer@2.3-command-buffer android.hardware.graphics.composer@2.4-command-buffer android.hardware.graphics.composer3-command-buffer; do
            { grep -A1 'cc_library_headers {' yuzora-stubs/Android.bp || true; } | grep -Fq "name: \"$stub\"" || { echo "::error::pre-build guard: stub $stub is not a cc_library_headers"; exit 1; }
          done
          # Runs #223/#224/#225/#226 fix: the new stubs must be present
          # at build time (same `name: "..."` grep form as above).
          for stub in libcompiler_rt update_engine_sideload; do
            grep -Fq "name: \"$stub\"" yuzora-stubs/Android.bp || { echo "::error::pre-build guard: stub missing at build time: $stub"; exit 1; }
          done
          # Runs #223/#224/#225/#226 fix: the 2 new stubs must be
          # plain cc_library at build time (same wrapped check as the
          # prune step above).
          for stub in libcompiler_rt update_engine_sideload; do
            { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq "name: \"$stub\"" || { echo "::error::pre-build guard: stub $stub is not a plain cc_library"; exit 1; }
          done
          # Runs #227/#228/#229/#230 fix: the new filegroup stub
          # must be present at build time (same `name: "..."` grep
          # form as above).
          grep -Fq 'name: "avb_testkey_rsa4096"' yuzora-stubs/Android.bp || { echo "::error::pre-build guard: stub missing at build time: avb_testkey_rsa4096"; exit 1; }
          # Runs #227/#228/#229/#230 fix: the new stub must be a
          # filegroup at build time (same wrapped check as the
          # prune step above).
          { grep -A1 'filegroup {' yuzora-stubs/Android.bp || true; } | grep -Fq 'name: "avb_testkey_rsa4096"' || { echo "::error::pre-build guard: stub avb_testkey_rsa4096 is not a filegroup"; exit 1; }
          # Runs #105/#106/#107 fix: libjsoncpp must be a plain cc_library
          # at build time (same check as the prune step above).
          { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq 'name: "libjsoncpp"' || { echo "::error::pre-build guard: libjsoncpp stub is not a plain cc_library"; exit 1; }
          # Runs #119/#120/#121 fix: libz must be a plain cc_library at
          # build time (same check as the prune step above).
          { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq 'name: "libz"' || { echo "::error::pre-build guard: libz stub is not a plain cc_library"; exit 1; }
          # Runs #122/#123/#124 fix: libcrypto + libselinux must be plain
          # cc_library stubs at build time (same check as the prune step).
          { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq 'name: "libcrypto"' || { echo "::error::pre-build guard: libcrypto stub is not a plain cc_library"; exit 1; }
          { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq 'name: "libselinux"' || { echo "::error::pre-build guard: libselinux stub is not a plain cc_library"; exit 1; }
          # Runs #131/#132/#133/#134 fix: libpcre2 must be a plain cc_library
          # at build time (same check as the prune step above).
          { grep -A1 'cc_library {' yuzora-stubs/Android.bp || true; } | grep -Fq 'name: "libpcre2"' || { echo "::error::pre-build guard: libpcre2 stub is not a plain cc_library"; exit 1; }
          # Runs #144/#145/#146 fix: libwinpthread must carry stl: "none"
          # at build time (same check as the prune step above).
          sed -n '/name: "libwinpthread"/,/^ *}/p' yuzora-stubs/Android.bp | grep -Fq 'stl: "none"' || { echo "::error::pre-build guard: libwinpthread stub must carry stl: \"none\" (runs #144/#145/#146 cycle fix)"; exit 1; }
          # Runs #105/#106/#107 fix: the common-ndk_shared defaults must
          # forward V6-ndk at build time (same check as the prune step).
          # Run #110 fix: grep -A5 false-negatived here too (the V6-ndk
          # line is 12 lines below the name: line) - use the whole-block
          # sed range, as in the prune step.
          sed -n '/name: "android.hardware.graphics.common-ndk_shared"/,/^ *}/p' yuzora-stubs/Android.bp | grep -Fq '"android.hardware.graphics.common-V6-ndk"' || { echo "::error::pre-build guard: common-ndk_shared defaults missing V6-ndk shared_libs"; exit 1; }
          if [ -d system/core/fs_mgr/tests ]; then
            echo "::error::pre-build guard: system/core/fs_mgr/tests present at build time"
            exit 1
          fi
          if [ -d frameworks/native/services/gpuservice/vts ]; then
            echo "::error::pre-build guard: frameworks/native/services/gpuservice/vts present at build time"
            exit 1
          fi
          if [ -d frameworks/native/libs/binder/tests/binder_sdk ]; then
            echo "::error::pre-build guard: frameworks/native/libs/binder/tests/binder_sdk present at build time"
            exit 1
          fi
          if [ -d frameworks/native/libs/binderthreadstate/1.0 ]; then
            echo "::error::pre-build guard: frameworks/native/libs/binderthreadstate/1.0 present at build time"
            exit 1
          fi
          if [ -d system/tools/xsdc/tests ]; then
            echo "::error::pre-build guard: system/tools/xsdc/tests present at build time"
            exit 1
          fi
          echo "Pre-build guard passed: pruned paths absent, stubs present."
          # Single module only. No ALLOW_MISSING_DEPENDENCIES — a missing
          # dep must fail here, not be silently skipped.
          m -j"$(nproc)" android.hardware.light-service.samsung 2>&1 | tee build-lights.log
          echo "=== disk after build ==="
          df -h

      - name: Verify built binary
        working-directory: lights-build
        run: |
          set -euo pipefail
          BIN="out/target/product/yuzora_lights/vendor/bin/hw/android.hardware.light-service.samsung"
          test -f "$BIN" || { echo "::error::built binary missing: $BIN"; exit 1; }
          ls -l "$BIN"
          file "$BIN"
          # Must be an arm64 (aarch64) device binary, not a host binary.
          readelf -h "$BIN" | grep -qi "aarch64" \
            || { echo "::error::built binary is not AArch64"; exit 1; }
          # Proof the fork's code is actually IN the binary: the
          # unstripped copy keeps symbols. (Soong strips the installed
          # binary, so check symbols/ not the installed path.)
          UNSTRIPPED="out/target/product/yuzora_lights/symbols/vendor/bin/hw/android.hardware.light-service.samsung"
          if [ -f "$UNSTRIPPED" ]; then
            if nm "$UNSTRIPPED" 2>/dev/null | grep -q "handleNotificationsNoOp"; then
              echo "Fork code confirmed: handleNotificationsNoOp present in unstripped binary."
            else
              echo "::error::handleNotificationsNoOp NOT found in unstripped binary — the fork's no-op light did not compile in"
              exit 1
            fi
          else
            echo "::warning::unstripped symbols binary not found at $UNSTRIPPED — symbol check skipped (binary + arch checks still passed)"
          fi
          # The .rc and VINTF fragment should be installed alongside the
          # binary; warn (do not fail) if their install paths differ.
          find out/target/product/yuzora_lights/vendor/etc -name "*light-service.samsung*" -print || true
          # Build info for the artifact.
          {
            echo "product: yuzora_lights-trunk_staging-userdebug"
            echo "module: android.hardware.light-service.samsung"
            echo "fork HEAD: $(git -C hardware/samsung rev-parse HEAD)"
            echo "fork log: $(git -C hardware/samsung log --oneline -1)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "binary: $BIN"
            echo "size: $(stat -c%s "$BIN") bytes"
            echo "sha256: $(sha256sum "$BIN" | cut -d' ' -f1)"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Disk usage report
        working-directory: lights-build
        run: |
          df -h
          echo "=== largest top-level dirs ==="
          du -sh -- * 2>/dev/null | sort -rh | head -20 || true
          echo "=== out/ size ==="
          du -sh out/ 2>/dev/null || echo "no out/ dir"

      - name: Upload lights HAL artifact
        uses: actions/upload-artifact@v4
        with:
          name: lights-hal-m51
          path: |
            lights-build/out/target/product/yuzora_lights/vendor/bin/hw/android.hardware.light-service.samsung
            lights-build/out/target/product/yuzora_lights/vendor/etc/init/android.hardware.light-service.samsung.rc
            lights-build/out/target/product/yuzora_lights/vendor/etc/vintf/manifest/android.hardware.light-service.samsung.xml
            lights-build/build-lights.log
            lights-build/BUILD_INFO.txt
          retention-days: 14
          if-no-files-found: error
